name: Scanner + TraderFox-Alarme

on:
  # KEIN GitHub-Zeitplan mehr (Mathias, 24.07.2026) — GitHubs cron war
  # hoffnungslos unpuenktlich. Den Freitags-Putz (alle Alarme loeschen,
  # zwei Minuten nach Nasdaq-Schluss) stoesst jetzt cron-job.org an:
  # Auftrag "Heliot Freitags-Putz", freitags 16:02 America/New_York
  # (sommerzeitfest, Fehler-E-Mail an Mathias), per workflow_dispatch mit
  # modus=alles_loeschen und loeschen=ALLE. Der Putz leert auch das
  # Fortschrittsgedaechtnis — der Montags-Lauf braucht kein neu=true.
  workflow_dispatch:
    inputs:
      modus:
        description: "Was soll laufen?"
        required: true
        default: "selbsttest"
        type: choice
        options:
          - selbsttest        # prüft nur, ob TraderFox noch wie erwartet aussieht
          - testalarm         # EIN Testalarm: anlegen, prüfen, wieder löschen
          - testpush          # nur eine ntfy-Testnachricht aufs Handy
          - test_2_aktien     # Scanner + Alarme für 2 Aktien
          - vollstaendig      # Scanner + Alarme für alle Treffer
          - aufraeumen        # gezielt einzelne Alarme entfernen
          - alles_loeschen    # SÄMTLICHE Alarme löschen (Feld 'loeschen' = ALLE)
          - datenvergleich    # Yahoo gegen FMP prüfen (ändert nichts)
          - ntfyputz          # nur die ntfy-Meldungen löschen (nach Handelsschluss)
          - inventur          # NUR LESEN: Alarmbestand zählen und vergleichen
          - websocketmessung  # Finnhub-WebSocket ausmessen (ändert nichts)
          - livetest          # Wächter mit Live-Strom, OHNE zu senden
          - liquiditaet       # Welche eurer Aktien sind echtzeit-tauglich?
          - feedpruefung      # Deckt der Gratis-Strom alle Aktien ab?
          - grenztest        # Grenze oder Abdeckung: zwei Dinge oder eines?
          - yahoostrom       # Trägt Yahoos eigener Live-Strom die ganze Liste?
          - volumenkurve     # Referenzkurve F(t) neu aus Kursdaten bauen
          - terminvergleich  # Zahlen-Termine: Finnhub gegen Yahoo und Nasdaq
          - kerzenvergleich  # Tageskerzen: Yahoo gegen Twelve Data (liest nur)
      alle_level:
        description: "Auch Fallback-Level alarmieren? (true/false)"
        required: false
        default: "false"
      neu:
        description: "Fortschritt ignorieren, alles neu setzen? (true/false) — nötig nach alles_loeschen"
        required: false
        default: "false"
      loeschen:
        description: "Für 'aufraeumen': BIOA:21.28 löscht nur diesen Preis, BIOA ohne Preis alle Alarme der Aktie (mischbar, Beistrich-getrennt) — für 'alles_loeschen': ALLE"
        required: false
        default: ""
      quelle:
        description: "Kaufpunkte-Quelle: neu_rechnen oder repo_datei (nimmt kaufpunkte_aktuell.xlsx vom letzten Nachtscan — gefeit gegen Yahoo-Datenaussetzer)"
        required: false
        default: "neu_rechnen"
        type: choice
        options:
          - neu_rechnen
          - repo_datei
      trotz_waechter:
        description: "Finnhub-Messung starten, obwohl der Wächter läuft? (true/false) — nur nach bewusster Entscheidung"
        required: false
        default: "false"

# ZWEI ALARM-LAEUFE DUERFEN SICH NIE UEBERSCHNEIDEN (gefunden am
# 11.08.2026 von gesamtpruefung.py, Block H — als einziger Ablauf hatte
# dieser keine Sperre). Der Bot meldet sich bei TraderFox an, arbeitet
# eine gemeinsame Kursliste ab und schreibt fortschritt.json; zwei
# gleichzeitige Laeufe wuerden einander die Suchkonsole umbauen und den
# Fortschritt gegenseitig ueberschreiben. Ohne Abbrechen, damit ein
# zweiter Anstoss wartet statt den laufenden zu zerschiessen.
concurrency:
  group: traderfox-alarme
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # actions: read wird gebraucht, um im Modus 'aufraeumen' die
    # kaufpunkte.xlsx aus dem Scanner-Workflow zu holen (Firmennamen).
    # Ohne diese Berechtigung scheitert der Download mit
    # "Resource not accessible by integration" — daran ist der Wächter
    # bei seinem ersten Lauf gescheitert.
    # contents: write, damit das Gesetzt-Gedaechtnis (fortschritt.json)
    # ins Repo gesichert werden kann — siehe Schritt 'Fortschritt sichern'.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- Sperre: nur EINE Finnhub-Verbindung gleichzeitig ---
      # Die Doku sagt woertlich: "1 API key can only open 1 connection at a
      # time." Wer misst, waehrend die Dauerwache laeuft, streitet mit ihr um
      # dieselbe Verbindung — sie wird geworfen, verbindet sich neu, wird
      # wieder geworfen. Genau das ist am 28.07.2026 passiert: Die
      # Feed-Pruefung lief mitten in der laufenden Wache. Gefaehrlich ist das
      # weniger fuer die Messung als fuer die Wache, die dann minutenlang
      # ohne Ticks dasteht (Alarme kommen weiter, aber nur im
      # Sechs-Minuten-Takt von Yahoo).
      # Deshalb: harter Stopp, ausser jemand entscheidet sich bewusst dagegen.
      - name: "Sperre gegen doppelte Finnhub-Verbindung"
        if: ${{ contains('websocketmessung,liquiditaet,feedpruefung,grenztest', github.event.inputs.modus) && github.event.inputs.trotz_waechter != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          offen=0
          for zustand in in_progress queued; do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/watcher.yml/runs?status=$zustand" --jq '.total_count' 2>/dev/null || echo 0)
            offen=$((offen + n))
          done
          if [ "$offen" -gt 0 ]; then
            echo "::error::Der Wächter läuft gerade ($offen Lauf/Läufe). Finnhub erlaubt nur EINE Verbindung je Schlüssel — eine Messung würde ihm die Ticks wegnehmen. Entweder den Wächter zuerst abbrechen, oder den Lauf mit trotz_waechter=true bewusst erzwingen."
            exit 1
          fi
          echo "Kein Wächter aktiv — die Finnhub-Verbindung ist frei."

      - name: Abhängigkeiten
        run: |
          pip install requests pandas numpy scipy openpyxl playwright yfinance
          playwright install chromium --with-deps

      # Nur die SESSION kommt aus dem Cache; fortschritt.json liegt seit
      # 27.07.2026 im Repo (Begruendung in scanner.yml an gleicher Stelle).
      - name: Session laden
        uses: actions/cache@v4
        with:
          path: session.json
          key: traderfox-state-${{ github.run_id }}
          restore-keys: traderfox-state-

      # --- Selbsttest: ändert nichts, prüft nur die Bedienelemente ---
      - name: "Selbsttest (TraderFox-Oberfläche prüfen)"
        if: ${{ github.event.inputs.modus == 'selbsttest' }}
        env:
          TRADERFOX_USER: ${{ secrets.TRADERFOX_USER }}
          TRADERFOX_PASS: ${{ secrets.TRADERFOX_PASS }}
        run: python traderfox_alarm_bot.py --selbsttest

      # --- Testalarm: legt EINEN Alarm an und loescht ihn wieder ---
      # Braucht den Scanner nicht, laeuft daher in wenigen Minuten.
      - name: "Testalarm (anlegen, prüfen, löschen)"
        if: ${{ github.event.inputs.modus == 'testalarm' }}
        env:
          TRADERFOX_USER: ${{ secrets.TRADERFOX_USER }}
          TRADERFOX_PASS: ${{ secrets.TRADERFOX_PASS }}
        run: python traderfox_alarm_bot.py --testalarm

      # --- Alles loeschen: SAEMTLICHE Alarme entfernen ---
      # Verriegelung: laeuft nur, wenn im Feld 'loeschen' woertlich ALLE
      # steht — ein versehentlicher Klick auf den Modus allein tut nichts.
      # Bewusst ohne Alarm-Sicherung (Mathias, 23.07.2026): die Aktienliste
      # ist das Original, der Scanner erzeugt die Alarme laufend neu.
      # SEIT 29.07.2026 im Ruhezustand: Sind die Alarme stillgelegt
      # (EINTRAGEN_AKTIV = False im Bot), entfällt auch das wöchentliche
      # Löschen — es gibt ja nichts mehr, was sich ansammeln könnte. Der
      # Freitagstermin bei cron-job.org kann deshalb unverändert weiter
      # feuern: Dieser Schritt überspringt sich selbst, der ntfy-Putz
      # darunter läuft weiter. Schaltet jemand die Alarme wieder scharf,
      # räumt der Freitag automatisch wieder mit auf.
      # Braucht man doch einmal eine Löschung im Ruhezustand: entweder
      # den Schalter im Bot kurz umlegen oder gezielt über den Modus
      # 'aufraeumen', der unverändert funktioniert.
      - name: "Alles löschen (sämtliche Alarme)"
        if: ${{ github.event.inputs.modus == 'alles_loeschen' }}
        env:
          TRADERFOX_USER: ${{ secrets.TRADERFOX_USER }}
          TRADERFOX_PASS: ${{ secrets.TRADERFOX_PASS }}
        run: |
          if [ "${{ github.event.inputs.loeschen }}" != "ALLE" ]; then
            echo "Verriegelung: Zum Bestätigen muss im Feld 'loeschen' genau ALLE stehen."
            exit 1
          fi
          if grep -q '^EINTRAGEN_AKTIV = True' traderfox_alarm_bot.py; then
            python traderfox_alarm_bot.py --loesche-alle
          else
            echo "Die TraderFox-Alarme sind stillgelegt — es wird keiner"
            echo "mehr eingetragen, also sammelt sich auch keiner an."
            echo "Das Löschen entfällt; der ntfy-Putz läuft weiter."
          fi

      # Der Putz raeumt auch die MELDUNGEN weg (Mathias, 27.07.2026): Er
      # hatte alte Signale der Vorwoche in der ntfy-App vorgefunden und
      # danach versehentlich gehandelt. Laeuft nach dem Alarm-Loeschen und
      # auch dann, wenn dort etwas schiefging — stehengebliebene alte
      # Meldungen sind das groessere Risiko.
      - name: "Alte ntfy-Meldungen löschen"
        if: ${{ always() && github.event.inputs.modus == 'alles_loeschen' && github.event.inputs.loeschen == 'ALLE' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ntfy_verlauf.py --putz "$NTFY_TOPIC"

      # --- Liquiditaet der eigenen Kandidaten messen ---
      # Mathias' Frage: Welche Aktien sind gross genug, dass sich
      # Echtzeit ueberhaupt lohnt? Wird gemessen, nicht geschaetzt.
      - name: "Echtzeit-Tauglichkeit messen"
        if: ${{ github.event.inputs.modus == 'liquiditaet' }}
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          pip install websocket-client
          python liquiditaet.py ${{ github.event.inputs.loeschen || '180' }}

      # --- Deckt der Gratis-Strom ueberhaupt alle Aktien ab? ---
      # Vodafone setzt 4,68 Millionen Stueck am Tag um und lieferte in ZWEI
      # Messungen null Ticks — das kann nicht an der Aktie liegen. Hier
      # stehen drei Quellen fuer dasselbe Zeitfenster nebeneinander:
      # Finnhubs eigener Kursabruf, der Strom und Yahoos Minutenumsatz.
      # Faellt eine Aktie nur im Strom aus, ist die Teilabdeckung belegt.
      - name: "Abdeckung des Gratis-Stroms pruefen"
        if: ${{ github.event.inputs.modus == 'feedpruefung' }}
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          pip install websocket-client
          python feedpruefung.py ${{ github.event.inputs.loeschen || '300' }}

      # --- Referenzkurve F(t) neu bauen ---
      # Die Kurve sagt, welcher Anteil des Tagesvolumens zu einer Uhrzeit
      # üblicherweise schon gehandelt ist. Sie ändert sich nur langsam
      # (Handelsgewohnheiten), muss also nicht laufend neu gebaut werden —
      # aber sie darf nicht veralten. Ergebnis wird ins Repo gelegt, damit
      # Scanner und Wächter sie ohne eigenen Abruf haben.
      - name: "Volumen-Referenzkurve bauen"
        if: ${{ github.event.inputs.modus == 'volumenkurve' }}
        run: |
          python volumen.py --bauen
          python volumen.py

      # --- Yahoos eigener Live-Strom ---
      # Braucht KEINEN Schlüssel, kollidiert also nicht mit dem Wächter und
      # steht deshalb bewusst nicht in der Finnhub-Sperre oben.
      # Zu Hause gemessen am 28.07.2026: 265 von 265 Tickern auf vier
      # Verbindungen, jede Meldung mit Tagesvolumen. Offen war nur, ob
      # Yahoo die Rechenzentrums-Adresse von GitHub genauso bedient wie
      # einen Privatanschluss.
      - name: "Yahoos Live-Strom messen"
        if: ${{ github.event.inputs.modus == 'yahoostrom' }}
        run: python yahoo_strom.py ${{ github.event.inputs.loeschen || '180' }}

      # --- Grenze oder Abdeckung? ---
      # Mathias' Frage vom 28.07.2026: Beide bisherigen Messungen liefen mit
      # GENAU 50 Symbolen, also punktgenau an der harten Grenze. Arbeitet
      # der Zugang dort unsauber, waere das eine ganz andere Ursache als
      # eine Abdeckungsluecke — und die Gegenmassnahme eine andere.
      - name: "Grenze gegen Abdeckung messen"
        if: ${{ github.event.inputs.modus == 'grenztest' }}
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          pip install websocket-client
          python grenztest.py ${{ github.event.inputs.loeschen }}

      # --- Waechter mit Live-Strom im Trockenlauf ---
      # Prueft die fertige Verdrahtung am offenen Markt, OHNE zu senden und
      # ohne den Zustand zu speichern. Bewusst in alarme.yml und nicht in
      # watcher.yml: Dort haengt eine Sperre gegen gleichzeitige Laeufe, der
      # Test wuerde sich hinter die laufende Dauerwache stellen.
      # Braucht KEINEN Finnhub-Schluessel mehr — Yahoos Strom laeuft ohne,
      # und mehrere Verbindungen stoeren einander nicht. Deshalb steht
      # dieser Modus auch nicht mehr in der Sperre oben.
      - name: "Wächter mit Live-Strom im Trockenlauf"
        if: ${{ github.event.inputs.modus == 'livetest' }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          cp kaufpunkte_aktuell.xlsx kaufpunkte.xlsx
          python breakout_watcher.py kaufpunkte.xlsx --dry-run \
            --dauerwache ${{ github.event.inputs.loeschen || '8' }}

      # --- Finnhub-WebSocket ausmessen (reines Lesen) ---
      # Belegt VOR dem Bau der Staffelung, was der Gratis-Zugang hergibt:
      # kommen Trades an, wie viele Ticks, und vor allem wie viele Symbole
      # gleichzeitig. Gerhards ~50 stehen nirgends in der Doku.
      # Im Feld 'loeschen' laesst sich "Sekunden Symbolzahl" mitgeben.
      - name: "Finnhub-WebSocket messen"
        if: ${{ github.event.inputs.modus == 'websocketmessung' }}
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          pip install websocket-client
          python finnhub_messung.py ${{ github.event.inputs.loeschen || '150' }}

      # --- Inventur: reines Lesen, veraendert nichts ---
      # Mathias' Frage vom 27.07.2026: Loest TraderFox jeden Alarm nur
      # einmal aus und entfernt ihn dann? Die Gegenprobe: Fehlen im Konto
      # genau die heute ueberschrittenen Marken, ist die Antwort ja.
      - name: "Alarmbestand messen (nur lesen)"
        if: ${{ github.event.inputs.modus == 'inventur' }}
        env:
          TRADERFOX_USER: ${{ secrets.TRADERFOX_USER }}
          TRADERFOX_PASS: ${{ secrets.TRADERFOX_PASS }}
        run: python traderfox_alarm_bot.py --inventur

      # --- Nur die ntfy-Meldungen raeumen (taeglich nach Handelsschluss) ---
      # Mathias, 27.07.2026: "Traderfox-Alarme sind, einmal ausgeloest,
      # geloescht. So haette ich es am liebsten bei ntfy — ich brauche das
      # nur zum Traden, nicht zum Nachlesen; Altes stiftet nur Verwirrung."
      # Laeuft darum werktags kurz nach der Schlussglocke: waehrend der
      # Sitzung steht alles zur Verfuegung, danach ist die Liste leer.
      - name: "ntfy-Meldungen löschen"
        if: ${{ github.event.inputs.modus == 'ntfyputz' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ntfy_verlauf.py --putz "$NTFY_TOPIC"

      # --- Datenvergleich: Yahoo gegen FMP, aendert nichts ---
      # Muss hier laufen, weil der FMP-Schluessel als Secret bei GitHub
      # liegt — Claude bekommt den Wert nie zu sehen.
      - name: "Daten vergleichen (Yahoo gegen FMP)"
        if: ${{ github.event.inputs.modus == 'datenvergleich' }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python datenvergleich.py ${{ github.event.inputs.loeschen }}

      # --- Termine vergleichen: Finnhub gegen Yahoo und Nasdaq ---
      # Mathias' Auftrag vom 13.08.2026: "miss Finnhub in der Cloud".
      # Hier, weil der Schluessel als Secret bei GitHub liegt; Claude
      # bekommt den WERT nie zu sehen, nur das Messergebnis.
      # Aendert NICHTS — liest drei Kalender und schreibt einen Bericht.
      - name: "Zahlen-Termine vergleichen (Finnhub gegen Yahoo und Nasdaq)"
        if: ${{ github.event.inputs.modus == 'terminvergleich' }}
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python termine_vergleich.py termine_vergleich.txt

      # --- Tageskerzen vergleichen: hat Twelve Data, was Yahoo aushoehlt? ---
      # Mathias, 18.08.2026. Hier, weil der Schluessel als Secret liegt.
      - name: "Tageskerzen vergleichen (Yahoo gegen Twelve Data)"
        if: ${{ github.event.inputs.modus == 'kerzenvergleich' }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python kerzenvergleich.py

      - name: "Terminvergleich sichern"
        if: ${{ github.event.inputs.modus == 'terminvergleich' }}
        uses: actions/upload-artifact@v4
        with:
          name: terminvergleich
          path: termine_vergleich.txt
          retention-days: 14

      # --- ntfy-Testnachricht: prueft nur die Push-Kette aufs Handy ---
      - name: "Push-Testnachricht (ntfy)"
        if: ${{ github.event.inputs.modus == 'testpush' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          # Adresse der Handels-App: haengt an jede Meldung die
          # Klick-Adresse mit den Zahlen des Alarms.
          HANDEL_URL: ${{ secrets.HANDEL_URL }}
        run: python breakout_watcher.py --testpush

      # --- Aufraeumen: einzelne Alarme gezielt entfernen ---
      # Holt die aktuellen Kaufpunkte nur, um Firmennamen nachzuschlagen.
      - name: "Kaufpunkte für Firmennamen laden"
        if: ${{ github.event.inputs.modus == 'aufraeumen' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: scanner.yml
          name: kaufpunkte
          path: .
          if_no_artifact_found: warn

      - name: "Alarme entfernen"
        if: ${{ github.event.inputs.modus == 'aufraeumen' }}
        env:
          TRADERFOX_USER: ${{ secrets.TRADERFOX_USER }}
          TRADERFOX_PASS: ${{ secrets.TRADERFOX_PASS }}
        run: |
          if [ -z "${{ github.event.inputs.loeschen }}" ]; then
            echo "Bitte im Feld 'loeschen' angeben, was entfernt werden soll."
            exit 1
          fi
          ARGS=""
          if [ -f kaufpunkte.xlsx ]; then ARGS="kaufpunkte.xlsx"; fi
          python traderfox_alarm_bot.py $ARGS --loesche "${{ github.event.inputs.loeschen }}"

      # --- Scanner: Kaufpunkte berechnen ---
      # Nur fuer die echten Laeufe. Der Scanner dauert 20-40 Minuten, daher
      # muessen selbsttest UND testalarm hier ausgenommen sein.
      - name: "Schritt 1: Kaufpunkte berechnen"
        if: ${{ (github.event.inputs.modus == 'test_2_aktien' || github.event.inputs.modus == 'vollstaendig') && github.event.inputs.quelle != 'repo_datei' }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python pattern_scanner.py finviz_3.csv --out kaufpunkte.xlsx --rate 8

      # Alternative: den bereits veroeffentlichten Nachtscan-Stand verwenden.
      # Grund (26.07.2026, 01:30): Ein frischer Yahoo-Abruf lieferte binnen
      # Minuten dreimal verschiedene Kursreihen (472/467/449 Alarme) — der
      # dritte Lauf setzte ~90 Alarme auf falschen Niveaus. Die im Repo
      # eingecheckte kaufpunkte_aktuell.xlsx ist der verbuergte Stand des
      # letzten Nachtscans und aendert sich zwischen den Laeufen nicht.
      - name: "Schritt 1 (Alternative): Kaufpunkte aus dem Repo übernehmen"
        if: ${{ (github.event.inputs.modus == 'test_2_aktien' || github.event.inputs.modus == 'vollstaendig') && github.event.inputs.quelle == 'repo_datei' }}
        run: cp kaufpunkte_aktuell.xlsx kaufpunkte.xlsx

      # --- Alarm-Bot ---
      - name: "Schritt 2: Alarme in TraderFox setzen"
        if: ${{ github.event.inputs.modus == 'test_2_aktien' || github.event.inputs.modus == 'vollstaendig' }}
        env:
          TRADERFOX_USER: ${{ secrets.TRADERFOX_USER }}
          TRADERFOX_PASS: ${{ secrets.TRADERFOX_PASS }}
        # Zwei Durchgaenge (Mathias, 27.07.): Nachzuegler SOFORT nachtragen.
        # Durchgang 2 ueberspringt Erledigtes; --neu gilt nur im ersten,
        # sonst wuerde der zweite alles noch einmal anfassen.
        # --abgleich im ersten Durchgang (Mathias, 27.07.2026): erst die
        # ueberholten Alarme raeumen, dann die neuen setzen. Der zweite
        # Durchgang holt nur noch Nachzuegler und braucht keinen Abgleich.
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.modus }}" = "test_2_aktien" ]; then EXTRA="$EXTRA --limit 2"; fi
          if [ "${{ github.event.inputs.alle_level }}" = "true" ]; then EXTRA="$EXTRA --alle"; fi
          NEU=""
          if [ "${{ github.event.inputs.neu }}" = "true" ]; then NEU="--neu"; fi
          python traderfox_alarm_bot.py kaufpunkte.xlsx $EXTRA $NEU --abgleich
          python traderfox_alarm_bot.py kaufpunkte.xlsx $EXTRA

      # Gesetzt-Gedaechtnis ins Repo sichern (auch die LEERUNG durch den
      # Freitags-Putz/alles_loeschen — der loescht die Datei, und genau
      # diese Loeschung muss eingecheckt werden, damit die neue Woche
      # wirklich leer beginnt). ZUSAETZLICH Gleichstand mit dem Waechter
      # (Mathias, 27.07.): Hat dieser Lauf Alarme aus einer frisch
      # gerechneten kaufpunkte.xlsx eingetragen, wird GENAU diese Datei
      # als kaufpunkte_aktuell.xlsx veroeffentlicht — der Waechter liest
      # sie und ueberwacht damit exakt die eingetragenen Alarme.
      - name: Fortschritt sichern + Wächter-Gleichstand
        if: always()
        run: |
          git config user.name "pattern-scanner"
          git config user.email "actions@users.noreply.github.com"
          if [ -f kaufpunkte.xlsx ]; then
            cp kaufpunkte.xlsx kaufpunkte_aktuell.xlsx
            git add kaufpunkte_aktuell.xlsx
          fi
          # Jede Datei einzeln und fehlertolerant: 'git add' bricht mit
          # Code 128 ab, wenn eine davon (noch) gar nicht existiert — der
          # ganze Lauf wurde dadurch rot gemeldet, obwohl alles geklappt
          # hatte (Inventur vom 27.07.). Ein rotes Kreuz ohne echten
          # Fehler ist gefaehrlich: Es verdeckt die echten.
          git add -A -- fortschritt.json 2>/dev/null || true
          git add -A -- ntfy_ids.json 2>/dev/null || true
          # Die neu gebaute Volumenkurve muss ins Repo zurück, sonst hätte
          # der Lauf sie nur für sich selbst gebaut.
          git add -A -- volumenkurven.json 2>/dev/null || true
          # Zahlen-Termine (Gerhard, 12.08.2026). Der Waechter liest
          # sie am naechsten Tag; ohne diesen Weg waeren sie nach
          # jedem Cloud-Lauf weg.
          git add -A -- zahlen_termine.json 2>/dev/null || true
          # Das Trigger-Logbuch: JEDES Signal, gekauft oder nicht. Es
          # waechst nur und wird nie geleert — ohne diesen Weg zurueck
          # ins Repo waere es nach jedem Cloud-Lauf weg, und dann liesse
          # sich nie messen, was die Regeln getaugt haetten.
          git add -A -- trigger_logbuch.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Fortschritt und Kaufpunkte unverändert."
          else
            git commit -m "Gesetzt-Gedächtnis/Kaufpunkte aktualisiert (Wächter-Gleichstand)"
            git pull --rebase origin main
            git push origin main
          fi

      # Immer hochladen — gerade im Fehlerfall ist das Debug-Material entscheidend
      - name: Ergebnis + Diagnose hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ergebnis
          path: |
            kaufpunkte.xlsx
            debug/
          retention-days: 14
          if-no-files-found: ignore
