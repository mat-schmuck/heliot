name: Pattern-Scanner (Kaufpunkte)

on:
  # KEIN GitHub-Zeitplan mehr (Mathias, 24.07.2026): GitHubs cron kam
  # beharrlich ~9 h zu spaet (23:45-Termin erst um 08:43 frueh). Den
  # Nachtscan stoesst jetzt cron-job.org an: Auftrag "Heliot Scan",
  # taeglich 18:00 New York = ca. 00:00 Wien, per workflow_dispatch;
  # Fehler-E-Mail geht an Mathias. Das Sendefenster fuer die
  # Treffer-Nachricht (00-01 Uhr Wien, siehe unten) bleibt unveraendert
  # wirksam, weil es im Schritt selbst geprueft wird.
  # SEIT 07.08.2026 DARF DIESER ABLAUF OEFTER ANGESTOSSEN WERDEN.
  # Anlass: Am 06.08. hatte GitHub Actions eine schwere Stoerung, der
  # Nachtscan um 18:00 New York bekam keinen Rechner und fiel aus. Bei
  # EINEM Termin am Tag heisst das: 24 Stunden mit veralteten
  # Kaufpunkten, und niemand merkt es.
  #
  # cron-job.org kann selbst NICHTS pruefen — es schickt eine Anfrage
  # und sieht die Antwort nicht an. Die Bedingung sitzt deshalb HIER:
  # Der Ablauf wird alle zehn Minuten angestossen und endet nach wenigen
  # Sekunden wieder, wenn der faellige Scan schon geglueckt ist. Erst
  # wenn er fehlt, laeuft der teure Teil (siehe scan_noetig.py).
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Auch scannen, wenn der fällige Scan schon geglückt ist (ja/nein)"
        required: false
        default: "nein"

# Zwei Scans duerfen sich nie ueberschneiden — sie schreiben dieselben
# Dateien. Ohne Abbrechen: Ein zweiter Anstoss wartet, statt den
# laufenden zu zerschiessen.
concurrency:
  group: pattern-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 200        # 87 Ticker @ 8 Calls/min brauchen Luft
    # contents: write, damit das Ergebnis als kaufpunkte_aktuell.xlsx ins
    # Repo gelegt werden kann — davon liest die Registerkarte
    # "Aktueller Scan" in der Heliot-App (Mathias' Auftrag vom 23.07.2026).
    permissions:
      contents: write
    steps:
      # Die Pruefung steht ganz vorn, damit ein ueberfluessiger Anstoss
      # nach Sekunden endet statt nach Minuten. Sie braucht nur den
      # Quelltext und Bordmittel — kein pip, kein Schluessel.
      - uses: actions/checkout@v4

      - name: Ist der fällige Scan schon erledigt?
        id: pruefung
        env:
          ERZWINGEN: ${{ github.event.inputs.erzwingen }}
        run: python3 scan_noetig.py

      - uses: actions/setup-python@v5
        if: steps.pruefung.outputs.noetig == 'ja'
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        if: steps.pruefung.outputs.noetig == 'ja'
        run: |
          pip install requests pandas numpy scipy openpyxl yfinance playwright
          playwright install chromium --with-deps

      # Nur die SESSION kommt aus dem Cache. Das Gesetzt-Gedaechtnis
      # (fortschritt.json) liegt seit 27.07.2026 IM REPO (kommt mit dem
      # Checkout): Der Cache verlor es de facto taeglich (Tagesfrist in
      # lade_fortschritt, inzwischen Wochenfrist) — der Bot setzte dann
      # morgens Alarme neu, die im Fruehhandel schon ausgeloest hatten,
      # und Mathias bekam Doppelsignale.
      - name: Session laden
        if: steps.pruefung.outputs.noetig == 'ja'
        uses: actions/cache@v4
        with:
          path: session.json
          key: traderfox-state-${{ github.run_id }}
          restore-keys: traderfox-state-

      - name: Scanner ausführen
        if: steps.pruefung.outputs.noetig == 'ja'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        # Sendefenster 00:00-01:59 Wiener Zeit (Mathias, 24.07.2026):
        # Der GEWOLLTE Push ist der des Mitternachtslaufs, den cron-job.org
        # um 18:00 New York anstoesst (in der Parallel-Sitzung vom 23.07.
        # eingerichtet, mit Fehler-E-Mail an Mathias). GitHubs eigener
        # 23:45-Zeitplan hinkt derzeit ~9 h nach, kam um 08:43 an und
        # weckte mit der WIEDERHOLUNG desselben Scans um ~09:00 die
        # Handys. Nachzuegler ausserhalb des Fensters scannen deshalb
        # weiter (frische Daten fuer Heliot und den Waechter-Artefakt),
        # senden aber nichts.
        # KEIN Push mehr (Mathias, 27.07.2026): Der Scan rechnet nur noch
        # die neue Liste; gemeldet wird ausschliesslich vom Waechter, und
        # zwar erst ab der New Yorker Eroeffnung. Die frueheren
        # Mitternachtsnachrichten waren Treffer, die zu diesem Zeitpunkt
        # ohnehin niemand handeln konnte.
        run: |
          python pattern_scanner.py finviz_3.csv \
            --out kaufpunkte.xlsx \
            --rate 8

      - name: Excel als Artifact hochladen
        if: steps.pruefung.outputs.noetig == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: kaufpunkte
          path: kaufpunkte.xlsx
          retention-days: 30

      # Ergebnis zusaetzlich ins Repo legen: Die Registerkarte
      # "Aktueller Scan" der Heliot-App liest die Datei ohne Anmeldung ueber
      # raw.githubusercontent.com — Artefakte waeren nur mit Anmeldung
      # erreichbar. Der Push loest keine anderen Workflows aus (alle laufen
      # nur per Zeitplan oder Knopfdruck); Streamlit startet die App kurz neu.
      - name: Ergebnis für die Heliot-Anzeige veröffentlichen
        if: steps.pruefung.outputs.noetig == 'ja'
        run: |
          cp kaufpunkte.xlsx kaufpunkte_aktuell.xlsx
          git config user.name "pattern-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add kaufpunkte_aktuell.xlsx
          # Fehlertolerant, siehe alarme.yml: fehlt die Datei, bricht
          # 'git add' mit Code 128 ab und faerbt den Lauf grundlos rot.
          git add -A -- ntfy_ids.json 2>/dev/null || true
          # Kapitel 9 und 10 (Gerhard, 02.08.2026): Die Fokusliste braucht
          # der Waechter am naechsten Morgen, und die Shakeout-Warteliste
          # muss ueber Tage hinweg ueberleben — ein Spring wartet bis zu
          # 15 Handelstage auf seinen Sekundaertest. Beide gehen deshalb
          # denselben Weg zurueck ins Repo wie ntfy_ids.json.
          git add -A -- fokusliste.json 2>/dev/null || true
          git add -A -- shakeout_warteliste.json 2>/dev/null || true
          # Die offenen Positionen (Exit-Regelwerk, Gerhard 05.08.2026).
          # Sie muessen ueber Tage ueberleben, sonst kennt das System
          # weder Einstiegskurs noch Datum und keine Regel der Ebenen
          # 2 und 3 kann greifen.
          git add -A -- positionen.json 2>/dev/null || true
          # Das Trigger-Logbuch: JEDES Signal, gekauft oder nicht. Es
          # waechst nur und wird nie geleert — ohne diesen Weg zurueck
          # ins Repo waere es nach jedem Cloud-Lauf weg, und dann liesse
          # sich nie messen, was die Regeln getaugt haetten.
          # Die Volumenkurven, eine je Aktie (Gerhard, 06.08.2026).
          # Der Waechter braucht sie am naechsten Morgen; ohne sie
          # gilt jede Aktie als NICHT VERIFIZIERBAR.
          git add -A -- volumenkurven.json 2>/dev/null || true
          git add -A -- trigger_logbuch.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Änderung gegenüber dem letzten Scan."
          else
            git commit -m "Nachtscan: kaufpunkte_aktuell.xlsx aktualisiert"
            git pull --rebase origin main
            git push origin main
          fi

      # KEIN automatisches Eintragen mehr im Nachtscan (Mathias, 27.07.2026):
      # Um ~00:30 Wien eingetragene Alarme feuerten ab 08:00 auf den
      # EU-Fruehhandelskursen — vor der US-Eroeffnung, also unhandelbar.
      # Saemtliche TraderFox-Eintragungen stoesst jetzt cron-job.org
      # "Heliot Alarme (08:00 New York)" an: Mo-Fr 08:00 New York
      # (14:00 Wien, 1,5 h vor der Glocke) per workflow_dispatch von
      # alarme.yml mit modus=vollstaendig und quelle=repo_datei — also
      # GENAU aus der hier veroeffentlichten kaufpunkte_aktuell.xlsx,
      # deckungsgleich mit dem ntfy-Waechter. Der Scan selbst (Rechnen,
      # Veroeffentlichen, Mitternachts-Push) bleibt um 18:00 New York;
      # zusaetzlich scannt Sonntag 18:00 New York die frisch hochgeladene
      # Wochenliste, damit sie Montag 08:00 New York bereitliegt.
