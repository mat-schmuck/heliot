name: Vorabwerte aus 8-K

# Gerhards F15 (Freigabe 02.09.2026, Modellkette von Mathias am 03.09.2026
# bestaetigt): Der Modus strom liest die neuesten Ergebnis-8-Ks der SEC,
# laesst die Mistral-Kette (ministral-14b-2512, mistral-medium-2604,
# mistral-small-2603) die Pressemitteilung auslesen und legt die Werte
# unuebersehbar vorlaeufig im PRIVATEN Datenrepo ab; der Modus abgleich
# ersetzt sie durch die amtliche Erstfassung, sobald der Quartalsbericht
# im SEC-Archiv steht. Ausgeloest von cron-job.org (strom alle 30 Minuten
# werktags 06:00 bis 20:00 New York, abgleich einmal am Tag); dazu kommt
# werktags um 09:20 New York ein Zusatzlauf, den berichte.yml auf main
# anstoesst, damit Zahlen kurz vor der Eroeffnung noch in den Earnings-Bericht
# gehen (Gerhard, 30.09.2026). Braucht die Secrets SEC_USER_AGENT,
# MISTRAL_API_KEY und DATEN_TOKEN; NTFY_TOPIC nur fuer die Ausfall-Meldung.

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "strom (neue 8-Ks lesen, danach der Earnings-Bericht), abgleich (amtliche Werte einsetzen), probe (ein 8-K, schreibt nichts) oder earnings_messen (Aktien je Tag im Earnings-Bericht, schreibt nichts)"
        type: choice
        options:
          - strom
          - abgleich
          - probe
          - earnings_messen
        default: strom
      tage:
        description: "earnings_messen: so viele Tage zurueck"
        required: false
        default: "10"
      hoechstens:
        description: "strom: hoechstens so viele 8-Ks je Lauf (0 = alle)"
        required: false
        default: "0"
      stunden:
        description: "strom: Rueckblick in Stunden, wenn noch kein Stand vorliegt"
        required: false
        default: "6"
      cik:
        description: "probe: CIK der Firma"
        required: false
        default: ""
      accession:
        description: "probe: Accession-Nummer des 8-K (mit Bindestrichen)"
        required: false
        default: ""

concurrency:
  group: vorabwerte-8k
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vorabwerte:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Sind die Secrets da?
        id: secrets
        env:
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          da=ja
          if [ -z "$DATEN_TOKEN" ]; then echo "Secret DATEN_TOKEN fehlt."; da=nein; fi
          if [ -z "$MISTRAL_API_KEY" ]; then echo "Secret MISTRAL_API_KEY fehlt."; da=nein; fi
          if [ -z "$SEC_USER_AGENT" ]; then echo "Secret SEC_USER_AGENT fehlt."; da=nein; fi
          echo "da=$da" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.da == 'ja'
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.da == 'ja'
        with:
          repository: mat-schmuck/heliot-daten
          token: ${{ secrets.DATEN_TOKEN }}
          path: daten
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.da == 'ja'
        with:
          python-version: "3.11"
      - name: Abhaengigkeiten
        if: steps.secrets.outputs.da == 'ja'
        run: pip install beautifulsoup4 lxml pandas pyarrow requests
      - name: Selbsttest
        if: steps.secrets.outputs.da == 'ja'
        run: |
          python vorabwerte_8k.py --selbsttest
          python earnings_bericht.py --selbsttest
      - name: Lauf
        if: steps.secrets.outputs.da == 'ja'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Seit 01.10.2026 stehen die Abweichungen der amtlichen Zahlen im
          # Reiter Berichte der App (Gerhard, 30.09.2026 nachts, Teil 4),
          # abgelegt im privaten Datenrepo; NTFY_TOPIC bleibt fuer Stoerungen.
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if [ "${{ inputs.modus }}" = "probe" ]; then
            python vorabwerte_8k.py --modus probe --cik "${{ inputs.cik }}" --accession "${{ inputs.accession }}"
          elif [ "${{ inputs.modus }}" = "earnings_messen" ]; then
            python earnings_bericht.py --daten daten --messen "${{ inputs.tage }}"
          else
            python vorabwerte_8k.py --daten daten --modus "${{ inputs.modus }}" --hoechstens "${{ inputs.hoechstens }}" --stunden "${{ inputs.stunden }}"
          fi
      # EARNINGS-BERICHT (Gerhard, 30.09.2026, Antworten 1 bis 5 und 12): nach
      # jedem Stromlauf bewertet earnings_bericht.py die neuen Vorabwerte und
      # ergaenzt, was die Kriterien erfuellt, den EINEN Tagesbericht im Reiter
      # Berichte; ab 19:30 New York steht an jedem Handelstag eine Meldung da,
      # auch ohne Treffer (Antworten 13 und 14 vom 01.10.2026).
      # Ein Fehler hier haelt die Ablage der Vorabwerte nicht auf; gemeldet wird
      # er ueber ntfy wie jede Stoerung.
      - name: Earnings-Bericht
        if: steps.secrets.outputs.da == 'ja' && inputs.modus == 'strom'
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: python earnings_bericht.py --daten daten
      - name: Ins Datenrepo
        if: steps.secrets.outputs.da == 'ja' && inputs.modus != 'probe' && inputs.modus != 'earnings_messen'
        run: |
          cd daten
          git config user.name "heliot-vorabwerte"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nichts Neues."
            exit 0
          fi
          git commit -q -m "Vorabwerte $(date -u +%Y-%m-%d_%H%MZ) (${{ inputs.modus }})"
          for versuch in 1 2 3; do
            if git push --quiet origin main; then
              echo "Gesichert."
              exit 0
            fi
            git pull --rebase --quiet -X theirs origin main || { git rebase --abort 2>/dev/null; git pull --rebase --quiet -X theirs origin main || true; }
          done
          echo "Push nach drei Anlaeufen gescheitert."
          exit 1
