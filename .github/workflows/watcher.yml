name: Breakout-Wächter (alle 6 Min)

on:
  # KEIN GitHub-Zeitplan mehr (Mathias, 24.07.2026): GitHubs cron hinkte
  # fuer dieses Repo beharrlich Stunden nach (belegt 22.-24.07., z. B.
  # 23:45-Termin kam um 08:43). Die Zeitsteuerung liegt jetzt komplett bei
  # cron-job.org (Konto von Mathias, Fehler-E-Mails an ihn):
  #   - "Heliot" wochentags 09:12 New York -> Dauerwache 390 Min
  #   - "Heliot Teil 2 (Schlussstunde)" wochentags 15:09 New York
  #     (haengt sich per concurrency hinter die Tagwache und uebernimmt
  #     die letzte Stunde, weil 390 Min ab 09:12 um ~15:42 enden)
  # Beide rufen workflow_dispatch ueber die GitHub-API auf. Die
  # Warte-bis-zur-Eroeffnung-Logik (sekunden_bis_eroeffnung) bleibt im
  # Programm: Startet die Tagwache vor 09:30 New York, wartet sie bis zur
  # Glocke. Zusaetzliches Sicherheitsnetz: die lokale 15:10-Aufgabe
  # "boersenwaechter-absicherung" auf Mathias' Rechner prueft werktags,
  # ob wirklich ein Waechter laeuft, und startet sonst selbst einen.
  workflow_dispatch:
    inputs:
      dauerwache:
        description: "Minuten am Stück wachen (0 = einmal prüfen). 390 = ganzer Handelstag."
        required: false
        default: "0"

# Verhindert, dass sich zwei Läufe überschneiden
concurrency:
  group: breakout-watcher
  cancel-in-progress: false

jobs:
  wachen:
    runs-on: ubuntu-latest
    # Hoch genug fuer die volle 390-Minuten-Dauerwache samt Wartezeit vor
    # der Eroeffnung und Rundenueberhang. 355 war ZU KNAPP: Die Tagwache
    # vom 24.07. (Lauf #23) wurde um 21:07 Wien vom Zeitlimit abgewuergt
    # ('cancelled'), zwei Minuten bevor die Schlussstunden-Wache
    # uebernahm. Normale Laeufe beenden sich weiterhin von selbst.
    timeout-minutes: 420
    # contents: write, damit die Kennungen der verschickten Meldungen
    # (ntfy_ids.json) eingecheckt werden koennen — der Freitags-Putz
    # braucht sie, um die Woche in der ntfy-App wieder aufzuraeumen.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install requests pandas openpyxl yfinance

      # EINE Wahrheit fuer Alarme UND Waechter: die im Repo eingecheckte
      # kaufpunkte_aktuell.xlsx (naechtlich vom Scanner aktualisiert, bei
      # Listenwechseln von Hand geprueft eingecheckt). Der fruehere
      # Artefakt-Download vom letzten Scanner-Lauf hing nach einem
      # Listenwechsel hinterher (26.07.: neue 265er-Liste ueber alarme.yml
      # eingetragen, das Artefakt zeigte noch die alte 778er) — der
      # Waechter haette veraltete Alarme ueberwacht (Mathias' Vorgabe:
      # immer synchron, nur die jeweils aktuellen Alarme).
      - name: Kaufpunkte aus dem Repo übernehmen
        run: cp kaufpunkte_aktuell.xlsx kaufpunkte.xlsx

      # Zustand (was wurde heute schon gemeldet) über Läufe hinweg merken
      - name: Zustand laden
        uses: actions/cache@v4
        with:
          path: watcher_state.json
          key: watcher-state-${{ github.run_id }}
          restore-keys: watcher-state-

      - name: Breakouts prüfen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
        run: |
          if [ ! -f kaufpunkte.xlsx ]; then
            echo "Keine kaufpunkte.xlsx gefunden — erst den Scanner laufen lassen."
            exit 0
          fi
          python breakout_watcher.py kaufpunkte.xlsx --dauerwache "${{ github.event.inputs.dauerwache || '0' }}"

      # Kennungen der verschickten Meldungen sichern. Ohne sie kann der
      # Freitags-Putz die Woche in der ntfy-App nicht wegraeumen — und
      # genau daran hat sich Mathias am 27.07. verbrannt (alte Signale
      # gelesen, versehentlich gehandelt). Auch bei Abbruch sichern.
      - name: ntfy-Verlauf sichern
        if: always()
        run: |
          git config user.name "pattern-scanner"
          git config user.email "actions@users.noreply.github.com"
          # Fehlertolerant: existiert die Datei noch nicht, bricht 'git add'
          # mit Code 128 ab und faerbt den ganzen Lauf rot (siehe alarme.yml).
          git add -A -- ntfy_ids.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine neuen Meldungen zu merken."
          else
            git commit -m "ntfy-Verlauf: Kennungen der verschickten Meldungen"
            git pull --rebase origin main
            git push origin main
          fi
