name: Breakout-Wächter (alle 6 Min)

on:
  # KEIN GitHub-Zeitplan mehr (Mathias, 24.07.2026): GitHubs cron hinkte
  # fuer dieses Repo beharrlich Stunden nach (belegt 22.-24.07., z. B.
  # 23:45-Termin kam um 08:43). Die Zeitsteuerung liegt jetzt komplett bei
  # cron-job.org (Konto von Mathias, Fehler-E-Mails an ihn):
  #   - "Heliot" (Tagwache) wochentags 09:28 New York -> Dauerwache 390 Min
  #   - "Heliot Teil 2 (Schlussstunde)" wochentags 15:26 New York
  #     (haengt sich per concurrency hinter die Tagwache und uebernimmt,
  #     sobald GitHub sie nach sechs Stunden abschiesst, also gegen 15:28)
  #
  # DIE ZEITEN AM 04.08.2026 VERSCHOBEN (Mathias), von 09:12 auf 09:28
  # und von 15:09 auf 15:26. Grund: Die sechs Stunden laufen ab dem Start
  # des Auftrags, jede Minute Vorlauf fehlt also am Nachmittag. Gemessen
  # dauert die ganze Vorbereitung 28 Sekunden — 18 Sekunden GitHub-
  # Ruestzeit, 8,6 Sekunden fuer die Tagesdaten aller 366 Aktien, eine
  # Sekunde fuer die fuenf Stromverbindungen. Dafuer waren 18 Minuten
  # reserviert. Jetzt sind es zwei, und der Handelstag ist 16 Minuten
  # laenger abgedeckt.
  # Beide rufen workflow_dispatch ueber die GitHub-API auf. Die
  # Warte-bis-zur-Eroeffnung-Logik (sekunden_bis_eroeffnung) bleibt im
  # Programm: Startet die Tagwache vor 09:30 New York, wartet sie bis zur
  # Glocke. Zusaetzliches Sicherheitsnetz: die lokale 15:10-Aufgabe
  # "boersenwaechter-absicherung" auf Mathias' Rechner prueft werktags,
  # ob wirklich ein Waechter laeuft, und startet sonst selbst einen.
  workflow_dispatch:
    inputs:
      dauerwache:
        description: "Minuten am Stück wachen (0 = einmal prüfen). 390 = ganzer Handelstag."
        required: false
        default: "0"

# Verhindert, dass sich zwei Läufe überschneiden
concurrency:
  group: breakout-watcher
  cancel-in-progress: false

jobs:
  wachen:
    runs-on: ubuntu-latest
    # Hier stand 420. Das ist WIRKUNGSLOS: GitHub schiesst jeden Auftrag
    # auf seinen eigenen Rechnern nach 360 Minuten ab, und timeout-minutes
    # kann diese Grenze nicht anheben, nur senken. Mathias' Frage vom
    # 04.08.2026 hat es zutage gebracht.
    #
    # Was daraus folgt: Bei --dauerwache 390 endet die Tagwache NICHT nach
    # 390 Minuten, sondern rund 360 Minuten nach dem Start des Auftrags —
    # bei Start 09:28 also gegen 15:28 New Yorker Zeit. Die
    # Schlussstunden-Wache wird 15:26 ausgeloest, haengt sich per
    # concurrency dahinter und uebernimmt in dem Moment, in dem die
    # Tagwache faellt.
    #
    # ACHTUNG, falls die Zeiten je geaendert werden: Diese ZWEIEINHALB
    # MINUTEN sind der einzige Puffer im ganzen Handelstag. Der zweite
    # Auftrag muss VOR dem Ende des ersten ausgeloest werden, sonst
    # entsteht ein Loch in der Ueberwachung. Wer die Startzeit der
    # Tagwache verschiebt, muss die des zweiten Auftrags mitverschieben.
    timeout-minutes: 360
    # contents: write, damit die Kennungen der verschickten Meldungen
    # (ntfy_ids.json) eingecheckt werden koennen — der Freitags-Putz
    # braucht sie, um die Woche in der ntfy-App wieder aufzuraeumen.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        # yfinance MINDESTENS 1.5 (28.07.2026): Erst ab dieser Fassung gibt
        # es yf.WebSocket, also Yahoos eigenen Live-Strom. Über ihn kommen
        # Kurs UND Tagesvolumen für alle 265 Aktien gleichzeitig. Er hat den
        # Finnhub-Strom abgelöst, der nur 51 Symbole trug und drei Aktien
        # der Liste überhaupt nicht (Vodafone, Ovintiv, Lowe's).
        run: pip install requests pandas openpyxl "yfinance>=1.5"

      # EINE Wahrheit fuer Alarme UND Waechter: die im Repo eingecheckte
      # kaufpunkte_aktuell.xlsx (naechtlich vom Scanner aktualisiert, bei
      # Listenwechseln von Hand geprueft eingecheckt). Der fruehere
      # Artefakt-Download vom letzten Scanner-Lauf hing nach einem
      # Listenwechsel hinterher (26.07.: neue 265er-Liste ueber alarme.yml
      # eingetragen, das Artefakt zeigte noch die alte 778er) — der
      # Waechter haette veraltete Alarme ueberwacht (Mathias' Vorgabe:
      # immer synchron, nur die jeweils aktuellen Alarme).
      - name: Kaufpunkte aus dem Repo übernehmen
        run: cp kaufpunkte_aktuell.xlsx kaufpunkte.xlsx

      # Zustand (was wurde heute schon gemeldet) über Läufe hinweg merken
      - name: Zustand laden
        uses: actions/cache@v4
        with:
          path: watcher_state.json
          key: watcher-state-${{ github.run_id }}
          restore-keys: watcher-state-

      - name: Breakouts prüfen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          # FINNHUB_API_KEY wird seit 28.07.2026 nicht mehr gebraucht —
          # Yahoos Strom braucht keinen Schlüssel. Das Secret bleibt im
          # Konto liegen, falls wir je zurückwollen; hier ist es raus,
          # damit niemand glaubt, der Wächter hinge noch daran.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
        run: |
          if [ ! -f kaufpunkte.xlsx ]; then
            echo "Keine kaufpunkte.xlsx gefunden — erst den Scanner laufen lassen."
            exit 0
          fi
          python breakout_watcher.py kaufpunkte.xlsx --dauerwache "${{ github.event.inputs.dauerwache || '0' }}"

      # Kennungen der verschickten Meldungen sichern. Ohne sie kann der
      # Freitags-Putz die Woche in der ntfy-App nicht wegraeumen — und
      # genau daran hat sich Mathias am 27.07. verbrannt (alte Signale
      # gelesen, versehentlich gehandelt). Auch bei Abbruch sichern.
      - name: ntfy-Verlauf sichern
        if: always()
        run: |
          git config user.name "pattern-scanner"
          git config user.email "actions@users.noreply.github.com"
          # KONFLIKTFREI ZURUECKSCHREIBEN (Ausfall vom 28.07.2026).
          # Vorher wurde committet und dann rebased. Schrieb waehrend des
          # Laufs jemand anderer ins Repo, fand das Rebase einen Konflikt
          # in ntfy_ids.json, brach ab, und die Kennungen des ganzen
          # Abends waren verloren — der Freitags-Putz haette genau diese
          # Meldungen nicht mehr vom Handy raeumen koennen.
          # Ein Konflikt ist hier ohnehin sinnlos: Die Datei ist eine
          # Liste, beide Seiten haben angehaengt, also gehoeren beide
          # Seiten hinein. Deshalb: eigenen Stand beiseitelegen, hart auf
          # den Serverstand gehen (dann KANN kein Konflikt entstehen),
          # vereinen, hochladen. Bis zu drei Anlaeufe, falls jemand genau
          # dazwischenfunkt.
          SICHERUNG=/tmp/ntfy_meine.json
          cp ntfy_ids.json "$SICHERUNG" 2>/dev/null || echo '[]' > "$SICHERUNG"
          # Dasselbe fuer das Trigger-Logbuch: 'git reset --hard' unten
          # wuerfe die Zeilen DIESES Laufs weg, also vorher sichern und
          # danach wieder einarbeiten. Die Datei waechst nur an, deshalb
          # ist Vereinen hier gefahrlos.
          LOGBUCH=/tmp/trigger_meines.jsonl
          cp trigger_logbuch.jsonl "$LOGBUCH" 2>/dev/null || : > "$LOGBUCH"
          for versuch in 1 2 3; do
            git fetch --quiet origin main
            git reset --hard --quiet FETCH_HEAD
            python ntfy_verlauf.py --vereinen "$SICHERUNG"
            python trigger_logbuch.py --vereinen "$LOGBUCH" || true
            git add -A -- ntfy_ids.json 2>/dev/null || true
            git add -A -- trigger_logbuch.jsonl 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Keine neuen Meldungen zu merken."
              break
            fi
            git commit -q -m "ntfy-Verlauf und Trigger-Logbuch des Wächterlaufs"
            if git push --quiet origin main; then
              echo "ntfy-Kennungen gesichert."
              break
            fi
            echo "Jemand war schneller (Versuch $versuch von 3) — noch einmal."
          done
